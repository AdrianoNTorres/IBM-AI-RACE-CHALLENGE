# Publishes the site on GitHub Pages: the presentation (the site/ folder) at the root and the
# run viewer (the viewer/ folder) under /viewer/. Both are static: no build step.
# Needs, once, in the repository settings: Pages > Source = "GitHub Actions", and
# Environments > github-pages > Deployment branches must allow the branch named below.
name: Publish the presentation and the run viewer

on:
  push:
    branches: [main]
    # the site itself, and the data its summary is made from
    paths: ['site/**', 'viewer/**', '.github/workflows/pages.yml', 'tools/viewer-summary/**', 'docs/CHANGELOG.md', 'runs/**', 'track.xml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # viewer/summary.json: lap and sector times of every recording, so the page knows them without reading the
      # recordings. If it cannot be made the site is published without it and works as before.
      - name: Write the summary
        continue-on-error: true
        run: node tools/viewer-summary/build.js
      - name: Put the presentation at the root and the viewer under /viewer/
        run: |
          mkdir _site
          cp -r site/. _site/
          cp -r viewer _site/viewer
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

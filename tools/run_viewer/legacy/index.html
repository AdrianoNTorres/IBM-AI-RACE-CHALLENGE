<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Run viewer</title>
<link rel="stylesheet" href="viewer.css"></head><body>
<div id="top"><div id="brand">Run viewer<span>Corkscrew</span></div>
<button class="tab on" data-t="pv">Versions</button><button class="tab" data-t="pm">Track</button><button class="tab" data-t="pt">Telemetry</button>
<div id="sel"><div id="chips"></div><button id="clr">Clear comparison</button>
<div class="seg" id="mode"><button data-m="simple">Simple</button><button data-m="adv">Advanced</button></div></div></div>

<div id="pv" class="page on"><div id="vmain"></div><div id="vside"></div></div>
<div id="pm" class="page"><canvas id="c"></canvas><div id="msg"></div><div id="hud"></div><canvas id="mini" width="210" height="210"></canvas><div id="leg"></div><div id="side"></div></div>
<div id="pt" class="page"></div><div id="tip"></div>
<div id="bar"><button id="play">Pause</button>
<label>Speed <select id="spd"><option>0.1</option><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option><option>4</option></select></label>
<button id="back">Previous</button><button id="fwd">Next</button><span id="rate" class="num"></span>
<input id="scrub" type="range" min="0" value="0"><span id="pos" class="num"></span></div>

<div id="nodata" style="display:none;padding:40px;color:#bdbcb2">No data found. Run <code>python tools/run_viewer/build.py</code> from the repository root, then reload this page.</div>
<script src="data/index.js"></script>
<script src="viewer.js"></script></body></html>

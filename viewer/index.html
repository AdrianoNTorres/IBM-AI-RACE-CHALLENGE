<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run viewer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ff5a1f'/%3E%3Cpath d='M8 22c0-9 4-12 9-12s7 3 7 6-3 5-6 5-4 2-4 4' fill='none' stroke='%23fff' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E">
<script>
/* theme before the first paint, so the page does not flash */
(function () {
  var p = {}, c = null, root = document.documentElement;
  try { p = JSON.parse(localStorage.getItem('rv_prefs') || '{}') || {}; } catch (e) {}
  var t = p.theme || 'system', m = /^custom:(.+)$/.exec(t);
  if (m && p.themes) for (var i = 0; i < p.themes.length; i++) if (p.themes[i] && p.themes[i].id === m[1]) c = p.themes[i];
  if (c) { t = c.base; for (var k in c.colors) root.style.setProperty('--' + k, c.colors[k]); }   /* a theme of the reader's own */
  if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  root.dataset.theme = t;
})();
</script>
<link rel="stylesheet" href="css/app.css?v=p186">
</head>
<body>
<a class="skip" href="#main">Skip to the content</a>

<header id="top">
  <div id="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7"/><path d="M8 22c0-9 4-12 9-12s7 3 7 6-3 5-6 5-4 2-4 4"/></svg>
    <div><b>Run viewer</b><span id="brandSub"></span></div>
  </div>
  <nav id="tabs" aria-label="Pages">
    <button class="tab" data-t="pv">Versions</button>
    <button class="tab" data-t="pm">Track</button>
    <button class="tab" data-t="pt">Telemetry</button>
  </nav>
  <div id="sel">
    <div id="chips"></div>
    <button id="clr" class="btn sm ghost">Clear comparison</button>
  </div>
  <div class="seg" id="viewsw" role="group" aria-label="How much detail the page shows">
    <button data-m="basic">Basic view</button>
    <button data-m="detailed">Detailed view</button>
  </div>
  <button class="tab" id="helpTab" data-t="ph"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.2"/><path d="M9.4 9.3a2.7 2.7 0 1 1 3.9 2.4c-.9.5-1.3 1-1.3 2.1"/><path d="M12 17.2v.3"/></svg>Help</button>
  <button class="tab" id="settingsTab" data-t="ps">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.5-2-3.5-2.4 1a7.6 7.6 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5A7.6 7.6 0 0 0 7 6.5l-2.4-1-2 3.5 2 1.5a7.6 7.6 0 0 0 0 3l-2 1.5 2 3.5 2.4-1a7.6 7.6 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.6 7.6 0 0 0 2.6-1.5l2.4 1 2-3.5-2-1.5Z"/></svg>
    Settings
  </button>
</header>
<div id="busy" role="status" aria-live="polite"><i></i><span></span></div>

<main id="main">
  <section id="pv" class="page" aria-label="Versions"><div id="vmain"></div><aside id="vside" aria-label="Version details"></aside></section>
  <section id="pm" class="page" aria-label="Track">
    <div id="mapwrap">
      <canvas id="c" tabindex="0" aria-label="Replay of the lap on the track map. Drag to pan, wheel to zoom."></canvas>
      <div id="overlay"><div id="hud"></div><canvas id="mini" width="190" height="190"></canvas><div id="sectorLive" hidden></div><div id="lapDeltaBar" hidden></div></div>
      <div id="leg"></div>
      <div id="inputs" aria-label="Steering, brake and throttle of the cars shown"></div>
      <button id="loopEnd" class="btn prim" hidden title="Stop looping this section">End loop</button>
      <div id="mapmsg"></div>
    </div>
    <button id="sideToggle" aria-label="Toggle side panel" title="Show/hide side panel">&#8250;</button>
    <aside id="side" aria-label="Map controls"></aside>
  </section>
  <section id="pt" class="page" aria-label="Telemetry"></section>
  <section id="ps" class="page" aria-label="Settings"></section>
  <section id="ph" class="page" aria-label="Help"></section>
  <section id="pe" class="page" aria-label="Status"></section>
</main>

<footer id="bar">
  <button id="play" class="btn prim" aria-label="Play or pause">Pause</button>
  <button id="back" class="btn" aria-label="One step back; hold to play backwards slowly">&#9664;</button>
  <button id="fwd" class="btn" aria-label="One step forward; hold to play slowly">&#9654;</button>
  <button id="autoLoop" class="btn toggle" aria-pressed="false">&#8635; Auto loop</button>
  <label class="spd">Speed
    <select id="spd"><option value="0.1">0.1&times;</option><option value="0.25">0.25&times;</option><option value="0.5">0.5&times;</option><option value="1">1&times;</option><option value="2">2&times;</option><option value="4">4&times;</option></select>
  </label>
  <button id="loopChip" class="btn sm prim" hidden title="Stop looping this section"></button>
  <span id="rate" class="num"></span>
  <input id="scrub" type="range" min="0" value="0" aria-label="Position in the lap">
  <span id="pos" class="num"></span>
</footer>

<div id="tour" hidden><div id="tourHole"></div><div id="tourCard" role="dialog" aria-modal="false" aria-labelledby="tourTitle"></div></div>
<div id="devnote" hidden></div>
<div id="tip"></div>
<div id="toast" role="alert"></div>
<input id="dirInput" type="file" webkitdirectory multiple hidden>

<script src="js/core.js?v=p186"></script>
<script src="js/keys.js?v=p186"></script>
<script src="js/theme.js?v=p186"></script>
<script src="js/track.js?v=p186"></script>
<script src="js/validate.js?v=p186"></script>
<script src="js/local.js?v=p186"></script>
<script src="js/data.js?v=p186"></script>
<script src="js/app.js?v=p186"></script>
<script src="js/sectors.js?v=p186"></script>
<script src="js/versions.js?v=p186"></script>
<script src="js/map.js?v=p186"></script>
<script src="js/inputs.js?v=p186"></script>
<script src="js/analysis.js?v=p186"></script>
<script src="js/telemetry.js?v=p186"></script>
<script src="js/settings.js?v=p186"></script>
<script src="js/entry.js?v=p186"></script>
<script src="js/help.js?v=p186"></script>
<script src="js/tutorial.js?v=p186"></script>
<script src="js/device.js?v=p186"></script>
<script src="js/view3d.js?v=p186"></script>
<script>RV.boot();</script>
</body>
</html>
